root = "."
tmp_dir = "tmp"

[build]
  pre_cmd = ["tailwindcss -i ./internal/web/static/input.css -o ./internal/web/static/app.css"]
  cmd = "go build -buildvcs=false -o ./tmp/buh ."
  bin = "./tmp/buh"
  args_bin = ["server"]
  delay = 1000
  exclude_dir = ["tmp", "vendor", ".docker"]
  include_ext = ["go", "tpl", "tmpl", "html", "css"]
  exclude_regex = [".*_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "green"
  runner = "cyan"
  watcher = "magenta"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true