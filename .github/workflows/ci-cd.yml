name: CI and CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buh-main-pipeline
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ghcr.io/viktorprogger/buh:main
            ghcr.io/viktorprogger/buh:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "### Published image"
            echo
            echo "ghcr.io/viktorprogger/buh:main"
            echo
            echo "Source commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: >-
      always() &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch') &&
      (needs.build.result == 'success' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - name: Check Europe/Belgrade deployment window
        id: window
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "automatic=false" >> "$GITHUB_OUTPUT"
            echo "Manual deployment: window check bypassed"
            exit 0
          fi

          hour="$(TZ=Europe/Belgrade date +%H)"
          hour="$((10#$hour))"
          echo "automatic=true" >> "$GITHUB_OUTPUT"
          if (( hour >= 20 && hour < 22 )); then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Deployment window is open: $(TZ=Europe/Belgrade date)"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Deployment deferred: current Europe/Belgrade time is $(TZ=Europe/Belgrade date)"
          fi

      - name: Deploy through the server-side locked script
        if: steps.window.outputs.allowed == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_PORT:?missing DEPLOY_PORT}"
          : "${DEPLOY_PATH:?missing DEPLOY_PATH}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"

          key="$RUNNER_TEMP/buh-deploy-key"
          known_hosts="$RUNNER_TEMP/buh-known-hosts"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts"

          if [[ "${{ steps.window.outputs.automatic }}" == "true" ]]; then
            printf -v remote_command 'cd -- %q && ./scripts/deploy.sh deploy --automatic' "$DEPLOY_PATH"
          else
            printf -v remote_command 'cd -- %q && ./scripts/deploy.sh deploy' "$DEPLOY_PATH"
          fi
          ssh -i "$key" \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_command"
