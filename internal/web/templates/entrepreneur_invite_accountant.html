{{template "entrepreneur_base" .}}

{{define "title"}}{{T "invite_accountant.title"}}{{end}}

{{define "content"}}
<div class="max-w-lg mx-auto">
  <div class="mb-4 text-sm text-gray-500">
    <a href="/e/" class="hover:text-primary">{{T "clients.back"}}</a>
  </div>

  <h1 class="text-2xl font-bold text-gray-900 mb-4">{{T "invite_accountant.title"}}</h1>

  <div class="bg-white border border-gray-200 rounded-lg shadow-xs p-6">
    <p class="text-sm text-gray-600 mb-6">
      {{T "invite_accountant.desc"}}
    </p>
    <form method="POST" action="/e/invite-accountant">
      <button id="btn-generate-invite" type="submit"
              class="rounded bg-primary px-5 py-2 text-sm font-medium text-white hover:bg-primary-hover">
        {{T "invite_accountant.generate"}}
      </button>
    </form>
  </div>
</div>
{{end}}
