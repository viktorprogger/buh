{{define "base"}}<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}Паушалне уплатнице{{end}}</title>
<link rel="stylesheet" href="/static/app.css">
<style>{{block "style" .}}{{end}}</style>
<script src="/static/htmx.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
{{block "nav" .}}
<header class="bg-slate-800 text-white shadow">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="/" class="font-semibold text-white hover:text-slate-200">Паушалне уплатнице</a>
    <nav class="flex gap-4 items-center">
      <a href="/" class="text-slate-300 hover:text-white text-sm">Предузетници</a>
      <a href="/logout" class="bg-slate-600 hover:bg-slate-500 text-white px-3 py-1 rounded text-sm">Одјава</a>
    </nav>
  </div>
</header>
{{end}}
<main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full">
{{block "content" .}}{{end}}
</main>
<footer class="border-t border-gray-200 bg-white mt-auto">
  <div class="max-w-5xl mx-auto px-4 py-3 text-sm text-gray-500">
    <a href="/privacy" class="hover:text-gray-700">Политика приватности</a>
    &middot;
    <a href="/terms" class="hover:text-gray-700">Услови коришћења</a>
  </div>
</footer>
</body>
</html>
{{end}}
