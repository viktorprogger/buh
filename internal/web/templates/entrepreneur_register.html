<!doctype html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрација предузетника</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">Регистрација предузетника</h1>

    {{if .Error}}
    <div class="mb-4 rounded bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">{{.Error}}</div>
    {{end}}

    <form method="POST" action="/e/register" class="bg-white rounded-lg border border-gray-200 shadow-xs p-6 space-y-4">
      <div>
        <label for="email" class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Е-пошта</label>
        <input id="email" type="email" name="email" value="{{.Email}}" required autofocus
               class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary">
      </div>
      <div>
        <label for="password" class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Лозинка</label>
        <input id="password" type="password" name="password" required
               class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary">
      </div>
      <div>
        <label for="confirm_password" class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Потврди лозинку</label>
        <input id="confirm_password" type="password" name="confirm_password" required
               class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary">
      </div>
      <button type="submit"
              class="w-full rounded bg-primary px-4 py-2 text-sm font-medium text-white hover:bg-primary-hover">
        Региструј се
      </button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-500">
      Већ имате налог?
      <a href="/login" class="text-primary hover:underline">Пријавите се</a>
    </p>
  </div>
</body>
</html>
