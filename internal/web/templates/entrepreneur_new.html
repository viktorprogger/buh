{{template "base" .}}

{{define "title"}}Нови предузетник — Паушалне уплатнице{{end}}

{{define "content"}}
<div class="mb-6">
  <h1 class="text-2xl font-bold text-gray-900">Нови предузетник</h1>
  <p class="text-sm text-gray-500 mt-1">Ручно унесите предузетника</p>
</div>

{{if .Error}}
<div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded text-sm">{{.Error}}</div>
{{end}}

<div class="bg-white border border-gray-200 rounded-lg p-6 shadow-xs max-w-lg">
  <form method="POST" action="/a/entrepreneurs/new" class="space-y-4">
    <div>
      <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Назив (кратко)</label>
      <input type="text" id="title" name="title" value="{{.Title}}"
             placeholder="нпр. Петар Петровић"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Назив <span class="text-red-500">*</span></label>
      <input type="text" id="name" name="name" value="{{.Name}}" required
             placeholder="нпр. Петар Петровић ПР"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div>
      <label for="mb" class="block text-sm font-medium text-gray-700 mb-1">МБ</label>
      <input type="text" id="mb" name="mb" value="{{.MB}}"
             placeholder="нпр. 12345678"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div>
      <label for="pib" class="block text-sm font-medium text-gray-700 mb-1">ПИБ <span class="text-red-500">*</span></label>
      <input type="text" id="pib" name="pib" value="{{.PIB}}" required
             placeholder="нпр. 1234567890"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div>
      <label for="address" class="block text-sm font-medium text-gray-700 mb-1">Адреса</label>
      <input type="text" id="address" name="address" value="{{.Address}}"
             placeholder="нпр. Улица бр. 1, Београд"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div>
      <label for="bank_account" class="block text-sm font-medium text-gray-700 mb-1">Жиро рачун</label>
      <input type="text" id="bank_account" name="bank_account" value="{{.BankAccount}}"
             placeholder="нпр. 123-0000000000000-00"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div>
      <label for="taxpayer_code" class="block text-sm font-medium text-gray-700 mb-1">Шифра пореског обвезника</label>
      <input type="text" id="taxpayer_code" name="taxpayer_code" value="{{.TaxpayerCode}}"
             placeholder="нпр. 5060"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div>
      <label for="activity_code" class="block text-sm font-medium text-gray-700 mb-1">Шифра делатности</label>
      <input type="text" id="activity_code" name="activity_code" value="{{.ActivityCode}}"
             placeholder="нпр. 6201"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit"
              class="rounded bg-primary px-4 py-2 text-sm font-medium text-white hover:bg-primary-hover">
        Сачувај
      </button>
      <a href="/"
         class="rounded border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
        Откажи
      </a>
    </div>
  </form>
</div>
{{end}}
