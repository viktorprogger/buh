{{template "base" .}}

{{define "title"}}Нови предузетник — Паушалне уплатнице{{end}}

{{define "content"}}
<div class="mb-6">
  <h1 class="text-2xl font-bold text-gray-900">Нови предузетник</h1>
  <p class="text-sm text-gray-500 mt-1">Ручно унесите предузетника</p>
</div>

{{if .Error}}
<div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded text-sm">{{.Error}}</div>
{{end}}

<div class="bg-white border border-gray-200 rounded-lg p-6 shadow-xs max-w-lg">
  <form method="POST" action="/entrepreneurs/new" class="space-y-4">
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Назив</label>
      <input type="text" id="name" name="name" value="{{.Name}}" required
             placeholder="нпр. Петар Петровић ПР"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div>
      <label for="pib" class="block text-sm font-medium text-gray-700 mb-1">ПИБ</label>
      <input type="text" id="pib" name="pib" value="{{.PIB}}" required
             placeholder="нпр. 1234567890"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit"
              class="rounded bg-primary px-4 py-2 text-sm font-medium text-white hover:bg-primary-hover">
        Сачувај
      </button>
      <a href="/"
         class="rounded border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
        Откажи
      </a>
    </div>
  </form>
</div>
{{end}}
