{{template "base" .}}

{{define "title"}}{{T "entrepreneur_new.title"}} — {{T "app.title"}}{{end}}

{{define "content"}}
<div class="mb-6">
  <h1 class="text-2xl font-bold text-gray-900">{{T "entrepreneur_new.title"}}</h1>
  <p class="text-sm text-gray-500 mt-1">{{T "entrepreneur_new.subtitle"}}</p>
</div>

{{if .Error}}
<div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded text-sm">{{.Error}}</div>
{{end}}

<div class="bg-white border border-gray-200 rounded-lg p-6 shadow-xs max-w-lg">
  <form method="POST" action="/a/entrepreneurs/new" class="space-y-4">
    <div>
      <label for="title" class="block text-sm font-medium text-gray-700 mb-1">{{T "entrepreneur_new.label_title"}}</label>
      <input type="text" id="title" name="title" value="{{.Title}}"
             placeholder="{{T "entrepreneur_new.ph_title"}}"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700 mb-1">{{T "entrepreneur_new.label_name"}} <span class="text-red-500">*</span></label>
      <input type="text" id="name" name="name" value="{{.Name}}" required
             placeholder="{{T "entrepreneur_new.ph_name"}}"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div>
      <label for="mb" class="block text-sm font-medium text-gray-700 mb-1">{{T "entrepreneur_new.label_mb"}}</label>
      <input type="text" id="mb" name="mb" value="{{.MB}}"
             placeholder="{{T "entrepreneur_new.ph_mb"}}" pattern="\d{8}" maxlength="8"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div>
      <label for="pib" class="block text-sm font-medium text-gray-700 mb-1">{{T "entrepreneur_new.label_pib"}} <span class="text-red-500">*</span></label>
      <input type="text" id="pib" name="pib" value="{{.PIB}}" required
             placeholder="{{T "entrepreneur_new.ph_pib"}}" pattern="\d{9}" maxlength="9"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div>
      <label for="address" class="block text-sm font-medium text-gray-700 mb-1">{{T "entrepreneur_new.label_address"}}</label>
      <input type="text" id="address" name="address" value="{{.Address}}"
             placeholder="{{T "entrepreneur_new.ph_address"}}"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div>
      <label for="bank_account" class="block text-sm font-medium text-gray-700 mb-1">{{T "entrepreneur_new.label_account"}}</label>
      <input type="text" id="bank_account" name="bank_account" value="{{.BankAccount}}"
             placeholder="{{T "entrepreneur_new.ph_account"}}"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div>
      <label for="taxpayer_code" class="block text-sm font-medium text-gray-700 mb-1">{{T "entrepreneur_new.label_taxpayer_code"}}</label>
      <input type="text" id="taxpayer_code" name="taxpayer_code" value="{{.TaxpayerCode}}"
             placeholder="{{T "entrepreneur_new.ph_taxpayer_code"}}"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div>
      <label for="activity_code" class="block text-sm font-medium text-gray-700 mb-1">{{T "entrepreneur_new.label_activity_code"}}</label>
      <input type="text" id="activity_code" name="activity_code" value="{{.ActivityCode}}"
             placeholder="{{T "entrepreneur_new.ph_activity_code"}}"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
    </div>
    <div class="flex gap-3 pt-2">
      <button id="btn-save-entrepreneur" type="submit"
              class="rounded bg-primary px-4 py-2 text-sm font-medium text-white hover:bg-primary-hover">
        {{T "entrepreneur_new.save"}}
      </button>
      <a href="/"
         class="rounded border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
        {{T "entrepreneur_new.cancel"}}
      </a>
    </div>
  </form>
</div>
{{end}}
